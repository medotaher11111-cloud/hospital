<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشهد المستشفى</title>
  <style>
    body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
  .overlay {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%); /* علشان يجي في النص بالظبط */
  color:#0f0;
  font-size:32px;
  text-align:center;
   display:none; 
}
  #hospitalVideo { width:100%; height:100vh; object-fit:cover; display:none; }
    
    #startBtn { padding:20px 40px; font-size:24px; cursor:pointer; border-radius:12px; background:#ff69b4; color:#fff; border:none; }
  </style>
</head>
<body>
  <!-- زر البداية -->
  <button id="startBtn">🚀 ابدأ الرحلة</button>

  <!-- الفيديو -->
  <video id="hospitalVideo">
    <source src="assets/hospital2.mp4" type="video/mp4">
  </video>
  <div class="overlay">💓.....نبض القلب يعمل</div>

<script>
  const startBtn = document.getElementById("startBtn");
  const video = document.getElementById("hospitalVideo");
  const overlay = document.querySelector(".overlay");
  let heartbeatSound = new Audio("assets/heartbeat.mp3");
  heartbeatSound.loop = true;

  startBtn.addEventListener("click", () => {
    // إخفاء الزر وإظهار الفيديو والنص
    startBtn.style.display = "none";
    video.style.display = "block";
    overlay.style.display = "block";

    // تشغيل الفيديو والصوت
    video.play();
    heartbeatSound.play();
  });

  // لما الفيديو يخلص، نوقف الصوت وننتقل للصفحة التانية
  video.addEventListener("ended", ()=>{
    heartbeatSound.pause();
    window.location.href = "main.html"; // الانتقال التلقائي
  });
</script>
</body>
</html>
